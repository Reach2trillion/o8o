import groovy.json.JsonSlurper

apply plugin: 'com.android.application'

// ABJ build settings, read from the environment (same variables as capacitor.config.ts, see mobile/README.md):
//   ABJ_APP_ID          applicationId, default com.abj.app (the Java package / namespace stays com.abj.app)
//   ABJ_APP_VERSION     versionName, default: "version" of mobile/package.json
//   ABJ_VERSION_CODE    versionCode, default 1 (CI passes the run number)
//   ABJ_KEYSTORE_FILE, ABJ_KEYSTORE_PASSWORD, ABJ_KEY_ALIAS, ABJ_KEY_PASSWORD
//                       release signing; without them assembleRelease builds an unsigned APK
//   ABJ_DEBUG_KEYSTORE_FILE
//                       debug signing key (alias androiddebugkey, passwords "android"), default: the public,
//                       throwaway app/abj-debug.keystore, so that every debug APK installs over the previous one.
//                       Debug APKs are debuggable test builds: never hand them out.
def abjEnv = { String name, String fallback ->
    def value = System.getenv(name)
    return value != null && !value.trim().isEmpty() ? value.trim() : fallback
}
def abjPackageVersion = new JsonSlurper().parse(rootProject.file('../package.json')).version
def abjKeystoreFile = abjEnv('ABJ_KEYSTORE_FILE', null)

android {
    namespace = "com.abj.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId abjEnv('ABJ_APP_ID', 'com.abj.app')
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode abjEnv('ABJ_VERSION_CODE', '1').toInteger()
        versionName abjEnv('ABJ_APP_VERSION', abjPackageVersion)
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        debug {
            storeFile file(abjEnv('ABJ_DEBUG_KEYSTORE_FILE', 'abj-debug.keystore'))
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        if (abjKeystoreFile) {
            release {
                storeFile file(abjKeystoreFile)
                storePassword abjEnv('ABJ_KEYSTORE_PASSWORD', '')
                keyAlias abjEnv('ABJ_KEY_ALIAS', '')
                keyPassword abjEnv('ABJ_KEY_PASSWORD', '')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (abjKeystoreFile) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

// Push notifications need the Firebase project file (never committed, CI writes it from the
// GOOGLE_SERVICES_JSON secret). Without it the app builds and runs, with push disabled.
try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
